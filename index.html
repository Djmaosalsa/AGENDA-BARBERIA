/* ==================================================
   CONTROL AUTOMÁTICO DE AGENDA
================================================== */

/*
   La agenda:
   - Cierra sábado a las 9:00 PM.
   - Permanece cerrada domingo hasta las 12:00 PM.
   - Abre domingo a las 12:00 PM para la nueva semana.
*/

function agendaEstaAbierta(){

    const ahora =
        new Date();

    const dia =
        ahora.getDay();

    const hora =
        ahora.getHours();

    if(
        dia === 6 &&
        hora >= 21
    ){
        return false;
    }

    if(
        dia === 0 &&
        hora < 12
    ){
        return false;
    }

    return true;

}


function calcularNumeroSemanaAutomatico(){

    const ahora =
        new Date();

    const dia =
        ahora.getDay();

    let martesActual =
        new Date(ahora);

    /*
       Domingo:
       se muestra la semana que comienza
       el martes siguiente.
    */

    if(dia === 0){

        martesActual.setDate(
            ahora.getDate() + 2
        );

    }

    /*
       Lunes:
       se muestra el martes siguiente.
    */

    else if(dia === 1){

        martesActual.setDate(
            ahora.getDate() + 1
        );

    }

    /*
       Martes a sábado:
       se usa el martes de esta semana.
    */

    else{

        martesActual.setDate(
            ahora.getDate() -
            (dia - 2)
        );

    }


    martesActual.setHours(
        0,0,0,0
    );


    const base =
        new Date(FECHA_BASE);

    base.setHours(
        0,0,0,0
    );


    const diferencia =
        martesActual.getTime() -
        base.getTime();


    return Math.round(
        diferencia /
        (1000 * 60 * 60 * 24 * 7)
    );

}

/* ==================================================
   OBTENER SEMANA
================================================== */

function obtenerSemana(){

    const inicio =
        new Date(FECHA_BASE);

    inicio.setDate(
        inicio.getDate() +
        numeroSemana * 7
    );


    const resultado = [];


    for(
        let i=0;
        i<5;
        i++
    ){

        const fecha =
            new Date(inicio);

        fecha.setDate(
            inicio.getDate()+i
        );


        resultado.push({

            fecha:
                formatoFecha(fecha),

            nombre:
                obtenerNombreDia(
                    fecha.getDay()
                ),

            corto:
                obtenerCortoDia(
                    fecha
                )

        });

    }


    return resultado;

}


/* ==================================================
   NOMBRES
================================================== */

function obtenerNombreDia(numero){

    const nombres = {

        2:"MARTES",
        3:"MIÉRCOLES",
        4:"JUEVES",
        5:"VIERNES",
        6:"SÁBADO"

    };


    return nombres[numero];

}


function obtenerCortoDia(fecha){

    const nombres = {

        2:"MAR",
        3:"MIÉ",
        4:"JUE",
        5:"VIE",
        6:"SÁB"

    };


    return (

        nombres[fecha.getDay()] +

        " " +

        String(
            fecha.getDate()
        ).padStart(2,"0")

    );

}


/* ==================================================
   FECHAS
================================================== */

function formatoFecha(fecha){

    return (

        fecha.getFullYear() +

        "-" +

        String(
            fecha.getMonth()+1
        ).padStart(2,"0") +

        "-" +

        String(
            fecha.getDate()
        ).padStart(2,"0")

    );

}


function formatearFecha(fecha){

    const partes =
        fecha.split("-");


    return (

        partes[2] +
        "/" +
        partes[1] +
        "/" +
        partes[0]

    );

}

async function obtenerCitas(){

                const hora =
                    String(cita.hora)

                if(!citas[fecha]){

                    citas[fecha] = [];

                }

                citas[fecha].push({

                    hora: hora

                });

            }
        );

        console.log(
            "Citas obtenidas de Supabase:",
            citas
        );

        return citas;

    }catch(error){

        console.error(
            "Error consultando Supabase:",
            error
        );

        return {};

    }

}

let cancelacionesFijasSupabase = {};

async function cargarCancelacionesFijas(){

    const { data, error } =
        await supabaseClient.rpc(
            "obtener_cancelaciones_fijas"
        );

    if(error){

        console.error(
            "Error obteniendo cancelaciones fijas:",
            error
        );

        cancelacionesFijasSupabase = {};
        return;
    }

    const datos = {};

    (data || []).forEach(cancelacion => {

        const fecha = cancelacion.fecha;

        const hora =
            String(cancelacion.hora).substring(0, 5);

        if(!datos[fecha]){
            datos[fecha] = [];
        }

        datos[fecha].push(hora);
    });

    cancelacionesFijasSupabase = datos;

    console.log(
        "Cancelaciones fijas desde Supabase:",
        cancelacionesFijasSupabase
    );
}

function estaFijaCancelada(
    fecha,
    hora
){

    return (
        cancelacionesFijasSupabase[fecha] &&
        cancelacionesFijasSupabase[fecha].includes(hora)
    );
}

/* ==================================================
   CONVERTIR HORA
================================================== */

function formatearHora(hora){

    const partes =
        hora.split(":");

    let h =
        Number(partes[0]);

    const minutos =
        partes[1];

    const periodo =
        h >= 12
        ? "PM"
        : "AM";

    if(h === 0){
        h = 12;
    }else if(h > 12){
        h -= 12;
    }

    return (
        h +
        ":" +
        minutos +
        " " +
        periodo
    );

}

    */

    alert(
        "✅ ¡CITA CONFIRMADA!\n\n" +
        "📅 " + formatearFecha(fechaActual) + "\n" +
        "⏰ " + formatearHora(horaSeleccionada) + "\n" +
        "👤 " + nombre +
        "\n\n" +
        "Ahora se abrirá WhatsApp para enviar la confirmación."
    );

    cerrarModal();

    await mostrarHorarios();

    /*
    ==========================================
    ABRIR WHATSAPP
    ==========================================
    */

    window.open(
        url,
        "_blank"
    );
}
async function enviarWhatsApp(){

    const nombre =
        document.getElementById(
            "nombre"
        ).value.trim();


    const whatsapp =
        document.getElementById(
            "whatsapp"
        ).value.trim();


    if(
        !nombre ||
        !whatsapp
    ){

        alert(
            "Completa tu nombre y tu número de WhatsApp."
        );

        return;

    }


    /*
       Antes de abrir WhatsApp comprobamos
       que el horario siga disponible.
    */

    const citas =
        await obtenerCitas();


    const citasDelDia =
        citas[fechaActual] || [];


    if(
        citasDelDia.some(
            c =>
            c.hora === horaSeleccionada
        )
    ){

        alert(
            "Lo sentimos, esta hora ya fue ocupada."
        );

        cerrarModal();

        mostrarHorarios();

        return;

    }


    const dia =
        obtenerSemana().find(
            d =>
            d.fecha === fechaActual
        );


    if(
        citasFijas[dia.nombre]
            .includes(
                horaSeleccionada
            )
        &&
        !estaFijaCancelada(
            fechaActual,
            horaSeleccionada
        )
    ){

        alert(
            "Lo sentimos, esta hora no está disponible."
        );

        cerrarModal();

        mostrarHorarios();

        return;

    }


    if(
        BARBERIA_WHATSAPP.includes(
            "X"
        )
    ){

        alert(
            "Primero configura el número de WhatsApp de la barbería en el código."
        );

        return;

    }


    const mensaje =

        "Hola, quiero solicitar una cita en la barbería.%0A%0A" +

        "📅 Fecha: " +
        formatearFecha(fechaActual) +
        "%0A" +

        "⏰ Hora: " +
        formatearHora(horaSeleccionada) +
        "%0A" +

        "👤 Nombre: " +
        encodeURIComponent(nombre) +
        "%0A" +

        "📱 Mi WhatsApp: " +
        encodeURIComponent(whatsapp);


    const url =
        "https://wa.me/" +
        BARBERIA_WHATSAPP +
        "?text=" +
        mensaje;


    /*
       IMPORTANTE:
       Aquí NO guardamos la cita.

       La solicitud llega por WhatsApp.
       El administrador la asigna desde admin.html.
    */

    window.open(
        url,
        "_blank"
    );


    cerrarModal();

}


/* ==================================================
   INICIO AUTOMÁTICO
================================================== */

function cargarAgendaAutomatica(){

    numeroSemana =
        calcularNumeroSemanaAutomatico();


    const semana =
        obtenerSemana();


    fechaActual =
        semana[0].fecha;


    actualizarEstadoAgenda();

    actualizarTitulo();

    mostrarDias();

    mostrarHorarios();

}


/* ==================================================
   ACTUALIZACIÓN AUTOMÁTICA
================================================== */

cargarAgendaAutomatica();


setInterval(
    function(){

        const nuevaSemana =
            calcularNumeroSemanaAutomatico();


        if(
            nuevaSemana !== numeroSemana
        ){

            numeroSemana =
                nuevaSemana;

            const semana =
                obtenerSemana();

            fechaActual =
                semana[0].fecha;

            actualizarTitulo();

            mostrarDias();

            mostrarHorarios();

        }


        actualizarEstadoAgenda();


        /*
           Actualizamos los horarios por si
           el administrador cambió una cita
           mientras esta página estaba abierta.
        */

        if(
            agendaEstaAbierta()
        ){

            mostrarHorarios();

        }

    },
    200000
);

</script>
